<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vacuum Lab Control</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='27' font-size='27'>&#127744;</text></svg>">
<!--
  No bundler: the lab PC is offline and has no Node toolchain, so Preact and
  htm are vendored as plain ES modules and resolved through this import map.
  htm gives JSX-like templates with no transpile step.
-->
<script type="importmap">
{
  "imports": {
    "preact": "/vendor/preact.module.js",
    "preact/hooks": "/vendor/hooks.module.js",
    "htm": "/vendor/htm.module.js"
  }
}
</script>
</head>
<body>
<div id="root"><div class="boot">Loading the control panel&hellip;</div></div>
<noscript>
  <div class="boot">
    This control panel needs JavaScript. The JSON API under <code>/api/</code>
    works without it &mdash; see the README.
  </div>
</noscript>
<script type="module" src="/app.js"></script>
</body>
</html>
